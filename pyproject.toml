[project]
name = "tj-work-development"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.1.1", "ruff>=0.17.4", "pytest-socket>=0.7.0"]

[tool.ruff]
extend-exclude = [".agents/sync_generated.py", ".agents/dependencies", ".codex/skills", ".claude/skills", ".codex/hooks/snapshot.py", ".codex/hooks/bootstrap.py", ".worktrees", ".template", "plugins"]
include = ["*.py", "*.pyi"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
explicit-preview-rules = true
preview = true
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF", "PGH004", "ANN401", "G004", "PLW1514", "LOG002", "LOG015", "PLC2701", "ICN001", "TID251", "TRY300", "PT009", "PT011", "PT006", "PLR6301"]

[tool.mypy]
explicit_package_bases = true
exclude = ["(^|/)(?:\\.agents/sync_generated\\.py|\\.agents/dependencies/|\\.codex/skills/|\\.claude/skills/|\\.codex/hooks/(?:snapshot|bootstrap)\\.py|\\.worktrees/|\\.template/)", "^plugins/"]
enable_error_code = ["ignore-without-code", "exhaustive-match"]
strict = true
warn_unreachable = true
files = [".agents"]

[tool.pytest]
filterwarnings = ["error"]
strict = true
testpaths = [".agents/tests"]
addopts = ["--import-mode=importlib", "-ra", "--disable-socket"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase" = { "msg" = "Use plain pytest functions and bare assertions." }
"importlib.util.spec_from_file_location" = { "msg" = "Import the installed public API; do not load another checkout by path." }
"sys.path" = { "msg" = "Install the declared dependency; do not modify the import search path." }

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = ["*"]

[tool.ruff.lint.per-file-ignores]
".agents/work/utility/draft-comment/scripts/post_pending_review.py" = ["I001"]
".agents/tests/test_teams_message.py" = ["E501", "I001", "PT009", "TID251"]
".agents/tests/test_teams_clipboard.py" = ["E501", "I001", "PLR6301", "PT009", "RUF059", "SIM117", "TID251", "UP012"]
".agents/tests/test_render_mermaid.py" = ["I001", "PT009", "TID251"]
".agents/tests/test_post_pending_review.py" = ["I001", "PT009", "TID251"]
".agents/tests/test_packaging.py" = ["E501", "I001", "PT009", "TID251"]
".agents/teams/utility/message/scripts/teams_message.py" = ["ANN401"]

[[tool.python-standards.exceptions]]
path = ".agents/teams/utility/message/scripts/teams_message.py"
rule = "PY016"
reason = "Legacy host integration reads process state while resolving native configuration."

[[tool.python-standards.exceptions]]
path = ".agents/work/utility/draft-comment/scripts/post_pending_review.py"
rule = "PY001"
reason = "Existing host integration traversal flattens nested records."

[tool.ruff.format]
exclude = [".agents/tests/test_packaging.py", ".agents/tests/test_render_mermaid.py", ".agents/tests/test_teams_clipboard.py", ".agents/tests/test_teams_message.py", ".agents/work/utility/confluence/render_mermaid.py"]

[[tool.mypy.overrides]]
module = "post_pending_review"
disable_error_code = ["no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "render_mermaid"
disable_error_code = ["no-any-return", "no-untyped-call", "no-untyped-def", "type-arg"]

[[tool.mypy.overrides]]
module = "test_packaging"
disable_error_code = ["no-untyped-call", "no-untyped-def", "union-attr"]

[[tool.mypy.overrides]]
module = "test_post_pending_review"
disable_error_code = ["arg-type", "no-untyped-call", "no-untyped-def", "union-attr"]

[[tool.mypy.overrides]]
module = "test_render_mermaid"
disable_error_code = ["arg-type", "no-untyped-call", "no-untyped-def", "union-attr"]

[[tool.mypy.overrides]]
module = "test_teams_clipboard"
disable_error_code = ["arg-type", "attr-defined", "no-untyped-call", "no-untyped-def", "union-attr"]

[[tool.mypy.overrides]]
module = "test_teams_message"
disable_error_code = ["arg-type", "no-untyped-call", "no-untyped-def", "union-attr"]
